{% extends "base.html" %}

{% block head%}
<title> Market page</title>
{% endblock %}

{% block header %}Market Page{% endblock %}

{% block body %}
<!--<p>{{items}}</p>-->

<table class="table table-hover table-dark">
    <thead>
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
        <th scope="col">Barcode</th>
        <th scope="col">Price</th>
    </tr>
    </thead>
    {% for item in items %}
    <tbody>
    <tr>
        <th scope="row">{{item.id}}</th>
        <td>{{item.name}}</td>
        <td>{{item.barcode}}</td>
        <td>{{item.price}}</td>
    </tr>
    </tbody>
    {% endfor %}
</table>
{% endblock %}
